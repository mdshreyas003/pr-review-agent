[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Production-grade AI PR review agent for Azure DevOps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "azure-identity>=1.19",
    "aiohttp>=3.10",  # async transport for azure.identity.aio (CertificateCredential, etc.)
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
